<!DOCTYPE html>

<head>

<title>Delatte</title>
<meta name="description" content="Vous êtes bien chez les Delatte.">
<meta name="theme-color" content="#E6F1FB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L27 30 L5 30 Z' fill='%233B6D11'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* Safari 26 (iOS) ignore theme-color : il teinte les zones sous la barre d'état
     et sous la barre d'outils avec le fond de la page ou d'un élément fixe au bord. */
  html{background:#E6F1FB}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bord{position:fixed;left:0;right:0;height:6px;pointer-events:none;z-index:0}
  .bord.haut{top:0;background:#E6F1FB}
  .bord.bas{bottom:0;background:#639922}
  .scene{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:#E6F1FB}
  .stars{position:absolute;inset:0;opacity:0;pointer-events:none}
  /* Transitions activées seulement après le premier rendu (pas de fondu au chargement) */
  .scene.pret{transition:background-color .8s}
  .scene.pret .stars{transition:opacity .8s}
  .stars span{position:absolute;border-radius:50%;background:#B5D4F4}
  /* overflow visible : le soleil et la lune peuvent monter dans le ciel au-dessus du dessin */
  .paysage{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block;overflow:visible}
  .intro{position:relative;z-index:2;max-width:40rem;
    padding:clamp(1.5rem,5vw,3.5rem);
    padding-top:max(clamp(1.5rem,8vh,4rem),env(safe-area-inset-top));
    padding-left:max(clamp(1.5rem,5vw,3.5rem),env(safe-area-inset-left))}
  h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:400;font-size:clamp(2.2rem,min(7vw,9vh),4.2rem);line-height:1.05;text-wrap:balance}
  .sub{margin-top:.6rem;font-size:clamp(1rem,2.2vw,1.2rem);line-height:1.45;text-wrap:pretty}
  .actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.3rem}
  .mail{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:.55rem 1.2rem;border-radius:999px;border:1px solid;text-decoration:none;font-size:1rem;transition:transform .15s}
  .mail:hover{transform:translateY(-1px)}
  .mail svg{width:1.1em;height:1.1em}

  /* Saisons, comme sur le tableau de bord Home Assistant : feuilles mortes en automne, neige à Noël */
  .meteo{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;display:none}
  body.saison-automne .feuilles{display:block}
  body.noel .feuilles{display:none}
  body.noel .neige{display:block}
  .neige i{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:neige linear infinite}
  @keyframes neige{to{transform:translate3d(24px,105vh,0)}}
  .feuilles i{position:absolute;top:-14px;width:9px;height:6px;border-radius:0 80% 0 80%;animation:feuille linear infinite}
  body.nuit .feuilles i{filter:brightness(.45)}
  @keyframes feuille{0%{transform:translate3d(0,0,0) rotate(0deg)}25%{transform:translate3d(18px,26vh,0) rotate(120deg)}
    50%{transform:translate3d(-6px,52vh,0) rotate(200deg)}75%{transform:translate3d(20px,78vh,0) rotate(300deg)}100%{transform:translate3d(0,105vh,0) rotate(400deg)}}
  .paysage .bulb{animation:scintille 1.8s ease-in-out infinite alternate}
  @keyframes scintille{from{opacity:1}to{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.meteo{display:none!important}.paysage .bulb{animation:none}}

  /* Panneau de don Ko-fi : s'ouvre par-dessus la carte postale au lieu de quitter le site */
  .don{border:0;padding:0;margin:auto;width:min(440px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);
    border-radius:20px;overflow:hidden;background:#FAFAFA;color:#0C447C;font-family:inherit;
    box-shadow:0 24px 60px rgba(4,44,83,.35)}
  .don[open]{display:flex;flex-direction:column;animation:donIn .22s ease-out}
  .don::backdrop{background:rgba(4,44,83,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  @keyframes donIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
  @keyframes donUp{from{transform:translateY(100%)}}
  .don-tete{display:flex;align-items:center;gap:.75rem;padding:.9rem .6rem .9rem 1.25rem;flex:none}
  .don-tete svg{width:1.7rem;height:1.7rem;flex:none}
  .don-titre{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:400;font-size:1.5rem;line-height:1.1}
  .don-sous{font-size:.9rem;margin-top:.2rem}
  .don-fermer{margin-left:auto;flex:none;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:inherit;
    font-size:1.7rem;line-height:1;cursor:pointer}
  .don-fermer:hover,.don-fermer:focus-visible{background:color-mix(in srgb,currentColor 12%,transparent)}
  .don-corps{position:relative;flex:none;height:min(560px,calc(100dvh - 170px))}
  .don-attente{position:absolute;inset:0;display:grid;place-items:center;color:#5F5E5A;font-size:.95rem}
  .don iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#FAFAFA;opacity:0;transition:opacity .3s}
  .don iframe.charge{opacity:1}
  .don-pied{flex:none;padding:.55rem 1rem calc(.65rem + env(safe-area-inset-bottom));text-align:center;font-size:.85rem;color:#5F5E5A}
  .don-pied a{color:inherit}
  /* Téléphone : le panneau monte du bas de l'écran */
  @media (max-width:600px){
    .don{width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:94dvh}
    .don[open]{animation:donUp .25s ease-out}
    .don-corps{height:auto;flex:1;min-height:min(540px,calc(94dvh - 160px))}
  }
  @media (prefers-reduced-motion:reduce){.don[open]{animation:none}}
</style>
</head>

  function saison(m, d){
    if ((m === 3 && d >= 20) || m === 4 || m === 5) return 'printemps';
    if ((m === 9 && d >= 22) || m === 10 || m === 11) return 'automne';
    if (m >= 6 && m <= 9) return 'ete';
    return 'hiver';
  }
  const show = (id, on) => $(id).setAttribute('display', on ? 'inline' : 'none');

  function periode(h){
    if (h >= 6 && h < 11) return 'matin';
    if (h >= 11 && h < 18) return 'jour';
    if (h >= 18 && h < 22) return 'soir';
    return 'nuit';
  }

  // Heure belge, ou heure forcée via ?h=22 pour tester
  function heure(){
    const q = new URLSearchParams(location.search).get('h');
    if (q !== null && !isNaN(parseFloat(q))) return Math.min(23.99, Math.max(0, parseFloat(q)));
    const parts = new Intl.DateTimeFormat('fr-BE', {hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Europe/Brussels'}).formatToParts(new Date());
    const get = t => parseInt(parts.find(p => p.type === t).value, 10);
    return (get('hour') % 24) + get('minute') / 60;
  }

  // Cadrage : vue large sur ordinateur, zoom sur la famille et la maison en portrait
  const paysage = document.querySelector('.paysage');
  const intro = document.querySelector('.intro');
  const portrait = window.matchMedia('(max-aspect-ratio: 1/1)');
  const HORIZON = 215;   // y où le soleil se couche derrière les collines
  let L;

  function cadrage(){
    L = portrait.matches
      ? {vb:'190 15 400 275', sx0:360, sx1:570, lune:560, sanglier:'translate(572,259) scale(0.8)'}
      : {vb:'0 0 680 290',   sx0:340, sx1:640, lune:600, sanglier:'translate(605,257) scale(0.8)'};
    paysage.setAttribute('viewBox', L.vb);
    $('boar').setAttribute('transform', L.sanglier);

    // Ciel réellement visible, converti en unités du dessin : le haut de l'écran
    // (ou le bas du texte en portrait) devient une coordonnée y du SVG.
    const [, vy, , vh] = L.vb.split(' ').map(Number);
    const box = paysage.getBoundingClientRect();
    const parPx = vh / box.height;
    const plafondPx = portrait.matches ? intro.getBoundingClientRect().bottom + 16 : 16;
    const plafond = vy + (plafondPx - box.top) * parPx;

    if (portrait.matches) {
      // Mobile : on profite du grand ciel vide sous le texte
      const ciel = 170 - plafond;
      L.zenith = plafond + Math.max(28, ciel * 0.3);
      L.luneY  = plafond + Math.max(26, ciel * 0.22);
    } else {
      // Écran large et bas : on abaisse l'arc pour ne pas couper le soleil ni la lune
      L.zenith = Math.max(45, plafond + 28);
      L.luneY  = Math.max(60, plafond + 26);
    }
    render();
  }

  function render(){
    const h = heure(), k = periode(Math.floor(h)), c = P[k], nuit = k === 'nuit';
    $('scene').style.backgroundColor = c.sky;
    document.querySelector('meta[name=theme-color]').setAttribute('content', c.sky);
    // Teinte des barres Safari 26 : ciel en haut, sol en bas
    document.documentElement.style.backgroundColor = c.sky;
    $('bordHaut').style.backgroundColor = c.sky;
    $('bordBas').style.backgroundColor = c.h2;
    ['h0','pf','h1','pm','h2','po','cA','cB','bB'].forEach(id => $(id).setAttribute('fill', c[id]));
    $('river').setAttribute('stroke', c.rv);
    document.querySelectorAll('.gl').forEach(e => e.setAttribute('fill', c.gl));
    $('stars').style.opacity = nuit ? 1 : 0;

    const sun = $('sun'), ms = $('moonshade');
    sun.setAttribute('fill', c.sun);
    if (nuit) {
      sun.setAttribute('cx', L.lune); sun.setAttribute('cy', Math.round(L.luneY)); sun.setAttribute('r', 22);
      ms.setAttribute('cx', L.lune + 10); ms.setAttribute('cy', Math.round(L.luneY) - 6);
      ms.setAttribute('opacity', 1); ms.setAttribute('fill', c.sky);
    } else {
      const t = (h - 6) / 15;
      sun.setAttribute('cx', Math.round(L.sx0 + (L.sx1 - L.sx0) * t));
      sun.setAttribute('cy', Math.round(HORIZON - Math.sin(Math.PI * t) * (HORIZON - L.zenith)));
      sun.setAttribute('r', 24); ms.setAttribute('opacity', 0);
    }

    // Papa passe en pyjama rayé la nuit (son pull bleu se fondait dans la colline)
    $('pull').setAttribute('fill', c.pu);
    document.querySelectorAll('.manche').forEach(e => e.setAttribute('stroke', c.ma));

    show('dmorning', k === 'matin'); show('dday', k === 'jour'); show('devening', k === 'soir'); show('dnight', nuit);
    show('kwave', k === 'jour'); show('kdown', k !== 'jour');
    show('boar', k === 'matin' || k === 'soir');
    ['dcap','kcap','dclosed','kclosed','zzz'].forEach(id => show(id, nuit));
    ['dopen','kopen'].forEach(id => show(id, !nuit));

    // Saisons : chênes orange et feuilles mortes en automne, arbres en fleurs au printemps,
    // neige, guirlande, sapin et bonnets du 7 décembre au 5 janvier
    const {mois, jour} = calendrier(), sa = saison(mois, jour);
    const noel = (mois === 12 && jour >= 7) || (mois === 1 && jour <= 5);
    const corps = document.body.classList;
    ['printemps','ete','automne','hiver'].forEach(s => corps.toggle('saison-' + s, s === sa));
    corps.toggle('noel', noel); corps.toggle('nuit', nuit);
    if (sa === 'automne') $('po').setAttribute('fill', nuit ? '#5A3415' : '#D9822B');
    show('s-printemps', sa === 'printemps'); $('s-printemps').setAttribute('opacity', nuit ? .45 : 1);
    show('s-noel', noel); show('kxmas', noel); show('dxmas', noel);
    if (noel) { show('kcap', false); show('dcap', false); }

    $('greet').textContent = c.g; $('greet').style.color = c.t1;
    $('sub').textContent = c.s; $('sub').style.color = c.t2;
    const m = $('mail');
    m.style.background = c.pb; m.style.borderColor = c.pbd; m.style.color = c.pc;
    const b = BOISSON[BOISSON_PAR_PERIODE[k]], cf = $('cafe');
    $('cafetxt').textContent = b.txt; $('cafeico').innerHTML = b.ico;
    cf.style.background = c.pb; cf.style.borderColor = c.pbd; cf.style.color = c.pc;
    // L'en-tête du panneau de don prend le ciel du moment
    const tete = $('donTete');
    tete.style.background = c.sky; tete.style.color = c.t1;
    $('donIco').innerHTML = b.ico; $('donTitre').textContent = b.txt;
    $('donSous').textContent = b.merci; $('donSous').style.color = c.t2;
  }

  // Ciel étoilé
  const champ = $('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('span');
    const r = Math.random() < 0.2 ? 3 : 2;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*65}%;width:${r}px;height:${r}px`;
    champ.appendChild(s);
  }

  // Flocons et feuilles mortes, tirés d'un hasard fixe pour que la scène reste la même à chaque visite
  let graine = 11;
  const hasard = () => (graine = (graine * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 70; i++) {
    const f = document.createElement('i'), t = 2 + hasard() * 4, d = 10 + hasard() * 12;
    f.style.cssText = `left:${(hasard()*100).toFixed(1)}%;width:${t.toFixed(1)}px;height:${t.toFixed(1)}px;animation-duration:${d.toFixed(1)}s;animation-delay:-${(hasard()*d).toFixed(1)}s;opacity:${(.55+hasard()*.45).toFixed(2)}`;
    $('neige').appendChild(f);
  }
  const TEINTES = ['#D9822B','#C2552E','#E8B33A','#A8461F'];
  for (let i = 0; i < 22; i++) {
    const f = document.createElement('i'), d = 14 + hasard() * 12;
    f.style.cssText = `left:${(hasard()*100).toFixed(1)}%;background:${TEINTES[i % 4]};animation-duration:${d.toFixed(1)}s;animation-delay:-${(hasard()*d).toFixed(1)}s`;
    $('feuilles').appendChild(f);
  }

  // Adresse e-mail
  $('mail').href = 'mailto:' + UTILISATEUR + '@' + DOMAINE;
  $('mailtxt').textContent = UTILISATEUR + '@' + DOMAINE;
  $('cafe').href = DON;
  $('donLien').href = DON;

  // Panneau de don : Ko-fi n'est chargé qu'au premier clic. Sans <dialog>, le lien
  // ouvre simplement la page Ko-fi dans un nouvel onglet.
  const don = $('don'), cadre = $('donCadre');
  cadre.addEventListener('load', () => {
    if (!cadre.getAttribute('src')) return;
    cadre.classList.add('charge'); $('donAttente').hidden = true;
  });
  if (typeof don.showModal === 'function') {
    $('cafe').addEventListener('click', e => {
      e.preventDefault();
      if (!cadre.getAttribute('src')) cadre.src = PANNEAU_KOFI;
      don.showModal();
    });
    $('donFermer').addEventListener('click', () => don.close());
    // Un clic sur le fond assombri ferme aussi le panneau
    don.addEventListener('click', e => { if (e.target === don) don.close(); });
  }

  // C'est parti
  let attente = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(attente);
    attente = requestAnimationFrame(cadrage);
  });
  cadrage();
  // Les fondus ne s'activent qu'une fois la bonne période affichée
  requestAnimationFrame(() => requestAnimationFrame(() => $('scene').classList.add('pret')));
  setInterval(render, 60000);
</script>
</body>
</html>
